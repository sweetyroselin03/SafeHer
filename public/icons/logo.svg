<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B214C"/>
      <stop offset="100%" stop-color="#3D1232"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E6C"/>
      <stop offset="100%" stop-color="#E53945"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F7DDE7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E53945" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular protective ripples -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5" stroke-dasharray="8 8"/>

  <!-- Protective Shield -->
  <path d="M256 96 L376 148 C376 276 256 368 256 368 C256 368 136 276 136 148 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Heart + Emergency Signal -->
  <!-- Stylized Winged Heart / Flame of safety -->
  <path d="M256 185 
           C275 155 315 158 328 190 
           C344 228 298 266 256 295 
           C214 266 168 228 184 190 
           C197 158 237 155 256 185 Z" 
        fill="url(#accentGrad)"/>

  <!-- Central Rescue Core (Beacon Dot) -->
  <circle cx="256" cy="218" r="13" fill="#FFFFFF"/>
  <circle cx="256" cy="218" r="6" fill="#5B214C"/>

  <!-- SafeHer typographic badge base -->
  <path d="M208 392 L304 392" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.3"/>
</svg>
